<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport: cover the full screen including notch ───── -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- ── Theme & PWA Chrome ────────────────────────────────── -->
    <meta name="theme-color" content="#0B0F19" />
    <meta name="background-color" content="#0B0F19" />

    <!-- ── iOS PWA ───────────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MatchDay" />

    <!-- ── Android TWA / Chrome ─────────────────────────────── -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ── SEO ──────────────────────────────────────────────── -->
    <meta
      name="description"
      content="World Cup 2026 Watch Party Finder. Reserve your seat at the best bars in LA, Mexico City, Toronto & NY/NJ — all near the stadiums."
    />
    <meta name="robots" content="index, follow" />

    <!-- ── Open Graph ────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Universal MatchDay Shovel — World Cup 2026" />
    <meta
      property="og:description"
      content="Find & reserve watch party spots near every World Cup 2026 host stadium."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- ── Twitter Card ──────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Universal MatchDay Shovel" />
    <meta name="twitter:description" content="World Cup 2026 Watch Party Finder" />

    <!-- ── PWA Manifest ──────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Favicon ───────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── Preconnect for performance ────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- ── Prevent FOUC: zinc-950 background immediately ─────── -->
    <style>
      html, body, #root {
        background-color: #09090b;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      /* Prevent rubber-band overscroll on iOS at the root level */
      body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
    </style>

    <title>MatchDay Shovel — World Cup 2026 Watch Parties</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
